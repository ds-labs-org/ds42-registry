name: Validate registry entries

on:
  pull_request:
    paths:
      - "entries/**"

env:
  # Configurable ceiling on how many *new* entries a single PR may add and
  # still be auto-merge-eligible. Anything above this is left for manual
  # review — a burst of many new files in one PR is exactly the shape a
  # bulk/automated abuse of the self-service path would take.
  MAX_NEW_ENTRIES: 2

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert only entries/** was touched
        # Belt-and-suspenders on top of the auto-merge job's own shape
        # check below: the *validate* job (and hence anything gating on
        # it) should not even consider a PR trustworthy if it touches
        # anything outside entries/** — including this very workflow file.
        # A PR that also edits .github/workflows/** can never legitimately
        # reach auto-merge; failing validate here makes that visible
        # immediately rather than relying only on the auto-merge job's
        # shape check.
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          other=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^entries/' || true)
          if [ -n "$other" ]; then
            echo "This PR touches paths outside entries/**, which this registry never auto-validates as a plain entry change:"
            echo "$other"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install rdflib pyshacl

      - name: List changed entry files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'entries/**')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate against schema/shapes.ttl (SHACL) + reachability probe
        run: python3 scripts/validate_entries.py ${{ steps.changed.outputs.files }}

  verify-edit-authorship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List modified (not new) entry files
        id: modified
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          files=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- 'entries/**' \
            | awk '$1=="M"{print $2}' | grep -v '^entries/_examples/' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify same-author edits (git blame + GitHub-verified commit authorship)
        if: steps.modified.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_edit_authorship.py \
            "origin/${{ github.base_ref }}" HEAD "${{ github.repository }}" \
            ${{ steps.modified.outputs.files }}

      - name: Nothing modified — trivially cleared
        if: steps.modified.outputs.files == ''
        run: echo "No existing entries were modified by this PR — nothing to verify."

  auto-merge:
    needs: [validate, verify-edit-authorship]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the diff's shape is auto-merge-eligible
        id: shape
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          status=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD")
          echo "$status"

          other=$(echo "$status" | awk '{print $1, $2}' | grep -v '^[AM] entries/' | grep -v '^[AM] entries/_examples/' || true)
          added=$(echo "$status" | grep -E '^A\sentries/' | grep -v 'entries/_examples/' || true)
          modified=$(echo "$status" | grep -E '^M\sentries/' | grep -v 'entries/_examples/' || true)
          added_count=$(echo -n "$added" | grep -c . || true)
          other_count=$(echo -n "$other" | grep -c . || true)

          eligible=true
          if [ "$other_count" != "0" ]; then
            echo "Touches paths outside entries/** (or entries/_examples/) — not eligible."
            eligible=false
          fi
          if [ "$added_count" -gt "$MAX_NEW_ENTRIES" ]; then
            echo "Adds $added_count new entries, over the MAX_NEW_ENTRIES=$MAX_NEW_ENTRIES ceiling — not eligible."
            eligible=false
          fi
          if [ -z "$added" ] && [ -z "$modified" ]; then
            echo "No added/modified entry recognized — not eligible."
            eligible=false
          fi
          # Modified files' authorship is enforced structurally: this job
          # only runs (needs:) after verify-edit-authorship has already
          # succeeded, which fails the whole run if any modified file
          # isn't author-cleared.

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.shape.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"

      # eligible == 'false': deliberately do nothing. The PR stays open
      # for manual review — it added too many entries at once, touched a
      # path this workflow doesn't recognize as a plain entry change, or
      # (structurally, via the verify-edit-authorship job dependency
      # above) modified an existing entry whose original author doesn't
      # match this PR's own commit author.
      #
      # NOTE: this job's merge step is a no-op unless the repository has
      # "Allow auto-merge" enabled under Settings -> General -> Pull
      # Requests — a one-time manual repo setting, not something a
      # workflow can toggle for itself.
